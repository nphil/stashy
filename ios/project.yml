name: Stashy

options:
  bundleIdPrefix: com.nphil
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"

settings:
  SWIFT_VERSION: 6.0

packages:
  stashy-videoengine:
    url: https://github.com/nphil/stashy-videoengine.git
    from: "1.0.0"

targets:
  Stashy:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Stashy
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: stashy-videoengine
        product: FFmpeg
      - target: StashyLiveActivity
        embed: true
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Stashy
        CFBundleName: Stashy
        CFBundleIdentifier: com.nphil.stashy
        CFBundleShortVersionString: "1.0.346"
        CFBundleVersion: "347"
        CFBundlePackageType: APPL
        CFBundleExecutable: $(EXECUTABLE_NAME)
        LSRequiresIPhoneOS: true
        UIRequiresFullScreen: false
        # Opt out of iPhone's default 60fps cap on Core Animation / CADisplayLink so custom animations
        # and display-link rendering can hit the full 120Hz ProMotion rate (scrolling is already 120Hz).
        CADisableMinimumFrameDurationOnPhone: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSFaceIDUsageDescription: Unlock Stashy with Face ID.
        NSSupportsLiveActivities: true
        # REQUIRED for the glasses (external display) scene. Without multi-scene support iOS never
        # creates a separate scene for a connected display — it silently system-mirrors the phone and
        # `configurationForConnecting` is never called for the external role (device-observed
        # 2026-08-03: v1.0.346 shipped the whole pipe and the Viture just mirrored; zero `glasses-*`
        # log lines because the delegate was unreachable). On iPhone this flag adds no user-facing
        # multi-window UI; it exists solely to make the external scene deliverable.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        # BackgroundTasks: opportunistic idle-time resume for the in-process download path.
        # BOTH keys are RUNTIME requirements with no compile-time signal — CI goes green and the IPA
        # publishes even if they are wrong. Without the permitted identifier, BGTaskScheduler.register
        # returns false and the feature is silently dead, which is why it is logged as `dl-bg-register`.
        # The identifier must match `DownloadManager.scheduledResumeID` exactly. Never a wildcard form:
        # that notation belongs to BGContinuedProcessingTask and raises an uncatchable ObjC exception.
        # `audio` is not only about user media playback: it is the runtime grant that lets the process
        # keep running while a download is in flight (DownloadKeepAlive holds an active AVAudioSession
        # and re-arms `beginBackgroundTask` on a 10 s cycle). A plist DECLARATION, not an entitlement —
        # policed at App Store review, which a sideloaded IPA never faces — so unlike the -3000 daemon
        # hand-over and BGContinuedProcessingTask it isn't gated on a signing privilege we don't have.
        # Proven shipping technique: XITRIX/iTorrent declares [audio, fetch, processing] and does
        # exactly this with zero `com.apple.developer.*` entitlements.
        # Possible side effect, UNVERIFIED: the key may let video audio keep playing when the app is
        # backgrounded mid-playback. Unlikely as written — the player is AVPlayerLayer-attached
        # (AVPlaybackEngine `layerClass`) and `audiovisualBackgroundPlaybackPolicy` is left at
        # `.automatic`, which Apple documents only as "the system decides". Check on device, and do NOT
        # read either outcome as evidence about whether the key itself took effect. Don't "fix" it by
        # setting `.continuesIfPossible` either: this key is unconditional while the keep-alive is
        # opt-in, so that would give background audio to every user with the toggle OFF and break the
        # invariant that off is byte-identical to before.
        UIBackgroundModes:
          - processing
          - audio
        BGTaskSchedulerPermittedIdentifiers:
          - com.nphil.stashy.downloads.resume
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nphil.stashy
        SWIFT_VERSION: 6.0
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        MARKETING_VERSION: "1.0.346"
        CURRENT_PROJECT_VERSION: "347"
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -O
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          # Off: bundled FFmpeg frameworks can carry CFBundleIdentifiers that product validation
          # rejects. We ship an unsigned IPA for sideloading, so validation is unnecessary.
          VALIDATE_PRODUCT: "NO"
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: -Onone
          DEBUG_INFORMATION_FORMAT: dwarf

  StashyLiveActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: StashyLiveActivity
        excludes:
          - Info.plist
      - path: Stashy/Services/DownloadActivityAttributes.swift
    info:
      path: StashyLiveActivity/Info.plist
      properties:
        CFBundleDisplayName: Stashy Activity
        CFBundleIdentifier: com.nphil.stashy.liveactivity
        CFBundleShortVersionString: "1.0.346"
        CFBundleVersion: "347"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nphil.stashy.liveactivity
        SWIFT_VERSION: 6.0
        SWIFT_STRICT_CONCURRENCY: complete
        APPLICATION_EXTENSION_API_ONLY: YES
        MARKETING_VERSION: "1.0.346"
        CURRENT_PROJECT_VERSION: "347"
        SKIP_INSTALL: YES
